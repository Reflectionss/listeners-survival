<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LISTENERS SURVIVAL - TRANSMISSION LOG</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Noto+Sans+KR:wght@300;400;700&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #000;
            overflow: hidden;
            font-family: 'Share Tech Mono', monospace;
            color: #0f0;
        }

        .start-screen {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: #000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .boot-text {
            font-family: 'Share Tech Mono', monospace;
            font-size: 24px;
            color: #0f0;
            text-align: center;
            text-shadow: 0 0 10px #0f0;
            margin-bottom: 40px;
        }

        .start-button {
            padding: 20px 60px;
            font-size: 18px;
            font-family: 'Share Tech Mono', monospace;
            color: #0f0;
            background: rgba(0, 255, 0, 0.1);
            border: 2px solid #0f0;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 3px;
            transition: all 0.3s;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.3);
        }

        .start-button:hover {
            background: rgba(0, 255, 0, 0.2);
            box-shadow: 0 0 30px rgba(0, 255, 0, 0.5);
        }

        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            background: #000;
        }

        .scan-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background:
                repeating-linear-gradient(
                    0deg,
                    transparent,
                    transparent 2px,
                    rgba(0, 255, 0, 0.03) 2px,
                    rgba(0, 255, 0, 0.03) 4px
                );
            pointer-events: none;
            z-index: 10;
        }

        .vignette {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: radial-gradient(circle at center, transparent 0%, rgba(0, 0, 0, 0.7) 100%);
            pointer-events: none;
            z-index: 5;
        }
    </style>
</head>
<body>

            > SYSTEM INITIALIZING...<br>
            > LISTENERS SURVIVAL<br>
            > TRANSMISSION LOG ACCESS
        </div>
        <div class="start-button" id="startButton">[ ACCESS LOG ]</div>
    </div>

    <div class="scan-overlay"></div>
    <div class="vignette"></div>
    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const startScreen = document.getElementById('startScreen');
        const startButton = document.getElementById('startButton');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        let audioCtx;
        let startTime;
        let currentLine = 0;
        let currentScene = 0;

        // Background ambient sound
        let bgOscillator;
        let bgGain;

        function startAmbientSound() {
            if (!audioCtx) return;
            try {
                bgOscillator = audioCtx.createOscillator();
                bgGain = audioCtx.createGain();

                bgOscillator.type = 'sine';
                bgOscillator.frequency.value = 40;
                bgGain.gain.value = 0.05;

                bgOscillator.connect(bgGain);
                bgGain.connect(audioCtx.destination);
                bgOscillator.start();
            } catch(e) {}
        }

        function playStaticNoise(duration) {
            if (!audioCtx) return;
            try {
                const bufferSize = audioCtx.sampleRate * duration;
                const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const output = buffer.getChannelData(0);

                for (let i = 0; i < bufferSize; i++) {
                    output[i] = (Math.random() * 2 - 1) * 0.15;
                }

                const noise = audioCtx.createBufferSource();
                const filter = audioCtx.createBiquadFilter();
                const gain = audioCtx.createGain();

                filter.type = 'bandpass';
                filter.frequency.value = 1500;

                noise.buffer = buffer;
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);

                noise.connect(filter);
                filter.connect(gain);
                gain.connect(audioCtx.destination);
                noise.start();
            } catch(e) {}
        }

        function playBeep() {
            if (!audioCtx) return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();

                osc.frequency.value = 800;
                gain.gain.value = 0.1;

                osc.connect(gain);
                gain.connect(audioCtx.destination);

                osc.start();
                osc.stop(audioCtx.currentTime + 0.05);
            } catch(e) {}
        }

            {

            {

        function drawScanLine(y) {
            ctx.strokeStyle = 'rgba(0, 255, 0, 0.3)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(0, y);
            ctx.lineTo(canvas.width, y);
            ctx.stroke();
        }

        function drawNoise() {
            for (let i = 0; i < 50; i++) {
                ctx.fillStyle = 'rgba(0, 255, 0, ' + (Math.random() * 0.05) + ')';
                ctx.fillRect(
                    Math.random() * canvas.width,
                    Math.random() * canvas.height,
                    2,
                    2
                );
            }
        }

        function drawHUD() {
            const time = new Date().toISOString().split('T')[1].split('.')[0];

            // Top left corner
            ctx.font = '12px Share Tech Mono';
            ctx.fillStyle = '#0f0';
            ctx.textAlign = 'left';
            ctx.fillText('REC', 20, 30);
            ctx.fillStyle = 'rgba(255, 0, 0, 0.8)';
            ctx.fillRect(50, 23, 8, 8);

            ctx.fillStyle = '#0f0';
            ctx.fillText(time, 70, 30);

            // Top right corner
            ctx.textAlign = 'right';
            ctx.fillText('SIGNAL: [' + '█'.repeat(Math.floor(Math.random() * 5) + 3) + ' '.repeat(5) + ']', canvas.width - 20, 30);

            // Bottom left
            ctx.textAlign = 'left';
            ctx.fillText('SYSTEM: ACTIVE', 20, canvas.height - 20);

            // Bottom right
            ctx.textAlign = 'right';
            ctx.fillText('ENCRYPTED CHANNEL', canvas.width - 20, canvas.height - 20);

            // Corner brackets
            ctx.strokeStyle = '#0f0';
            ctx.lineWidth = 2;
            const cornerSize = 20;

            // Top left
            ctx.beginPath();
            ctx.moveTo(10, 10 + cornerSize);
            ctx.lineTo(10, 10);
            ctx.lineTo(10 + cornerSize, 10);
            ctx.stroke();

            // Top right
            ctx.beginPath();
            ctx.moveTo(canvas.width - 10 - cornerSize, 10);
            ctx.lineTo(canvas.width - 10, 10);
            ctx.lineTo(canvas.width - 10, 10 + cornerSize);
            ctx.stroke();

            // Bottom left
            ctx.beginPath();
            ctx.moveTo(10, canvas.height - 10 - cornerSize);
            ctx.lineTo(10, canvas.height - 10);
            ctx.lineTo(10 + cornerSize, canvas.height - 10);
            ctx.stroke();

            // Bottom right
            ctx.beginPath();
            ctx.moveTo(canvas.width - 10 - cornerSize, canvas.height - 10);
            ctx.lineTo(canvas.width - 10, canvas.height - 10);
            ctx.lineTo(canvas.width - 10, canvas.height - 10 - cornerSize);
            ctx.stroke();
        }

        function typewriterEffect(text, x, y, maxChars) {
            const lines = [];
            let currentLine = '';
            const words = text.split(' ');

            words.forEach(word => {
                if ((currentLine + word).length > maxChars) {
                    lines.push(currentLine.trim());
                    currentLine = word + ' ';
                } else {
                    currentLine += word + ' ';
                }
            });
            if (currentLine) lines.push(currentLine.trim());

            return lines;
        }

        function drawScene(scene, progress) {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.9)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Header
            ctx.font = 'bold 20px Share Tech Mono';
            ctx.fillStyle = '#0f0';
            ctx.textAlign = 'left';
            ctx.shadowColor = '#0f0';
            ctx.shadowBlur = 10;
            ctx.fillText('> ' + scene.header, 40, 80);

            if (scene.subheader) {
                ctx.font = '16px Share Tech Mono';
                ctx.fillStyle = 'rgba(0, 255, 0, 0.7)';
                ctx.fillText(scene.subheader, 40, 110);
            }

            // Horizontal line
            ctx.strokeStyle = 'rgba(0, 255, 0, 0.5)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(40, 130);
            ctx.lineTo(canvas.width - 40, 130);
            ctx.stroke();

            // Content
            const startY = 170;
            const lineHeight = 30;
            const visibleLines = Math.floor(progress * scene.lines.length);

            ctx.font = '16px Share Tech Mono';
            ctx.shadowBlur = 5;

            for (let i = 0; i < visibleLines && i < scene.lines.length; i++) {
                const line = scene.lines[i];
                const opacity = Math.min((progress - (i / scene.lines.length)) * 3, 1);

                if (line === '') {
                    continue;
                }

                if (line.includes('ALERT') || line.includes('WARNING') || line.includes('CRITICAL')) {
                    ctx.fillStyle = 'rgba(255, 100, 100, ' + opacity + ')';
                    ctx.shadowColor = 'rgba(255, 100, 100, 0.8)';
                } else if (line.startsWith('>')) {
                    ctx.fillStyle = 'rgba(0, 255, 0, ' + (opacity * 0.9) + ')';
                    ctx.shadowColor = '#0f0';
                } else {
                    ctx.fillStyle = 'rgba(200, 255, 200, ' + (opacity * 0.8) + ')';
                    ctx.shadowColor = 'rgba(0, 255, 0, 0.5)';
                }

                // Korean text handling
                const hasKorean = /[ㄱ-ㅎ|ㅏ-ㅣ|가-힣]/.test(line);
                if (hasKorean) {
                    ctx.font = '15px Noto Sans KR';
                } else {
                    ctx.font = '16px Share Tech Mono';
                }

                ctx.fillText(line, 60, startY + i * lineHeight);

                // Cursor effect on last visible line
                if (i === visibleLines - 1 && Math.floor(Date.now() / 500) % 2 === 0) {
                    const textWidth = ctx.measureText(line).width;
                    ctx.fillStyle = '#0f0';
                    ctx.fillRect(65 + textWidth, startY + i * lineHeight - 14, 8, 16);
                }
            }

            ctx.shadowBlur = 0;

            // Scanning line
            const scanY = (Date.now() % 3000) / 3000 * canvas.height;
            drawScanLine(scanY);

            // Noise
            drawNoise();

            // HUD
            drawHUD();
        }

        function animate() {
            const elapsed = (Date.now() - startTime) / 1000;

            // Calculate current scene
            let accumulatedTime = 0;
            let currentSceneIndex = 0;

            for (let i = 0; i < storyScenes.length; i++) {
                if (elapsed < accumulatedTime + storyScenes[i].duration) {
                    currentSceneIndex = i;
                    break;
                }
                accumulatedTime += storyScenes[i].duration;
            }

            const sceneStartTime = elapsed - accumulatedTime;
            const scene = storyScenes[currentSceneIndex];
            const sceneProgress = sceneStartTime / scene.duration;

            // End of all scenes
            if (elapsed > storyScenes.reduce((sum, s) => sum + s.duration, 0)) {
                ctx.fillStyle = '#000';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                if (bgOscillator) {
                    bgGain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 2);
                    setTimeout(() => {
                        if (bgOscillator) bgOscillator.stop();
                    }, 2000);
                }

                setTimeout(() => {
                    startScreen.style.display = 'flex';
                    startButton.textContent = '[ REPLAY LOG ]';
                }, 2000);
                return;
            }

            // Play sound effects
            if (currentSceneIndex !== currentScene) {
                playStaticNoise(0.3);
                currentScene = currentSceneIndex;
            }

            // Beep sound for each new line
            const currentVisibleLines = Math.floor(sceneProgress * scene.lines.length);
            if (currentVisibleLines !== currentLine) {
                if (scene.lines[currentVisibleLines] && scene.lines[currentVisibleLines].trim() !== '') {
                    playBeep();
                }
                currentLine = currentVisibleLines;
            }

            drawScene(scene, sceneProgress);

            requestAnimationFrame(animate);
        }

        startButton.addEventListener('click', () => {
            startScreen.style.display = 'none';

            try {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                startAmbientSound();
                playStaticNoise(0.5);
            } catch(e) {}

            currentScene = -1;
            currentLine = -1;
            startTime = Date.now();
            animate();
        });
    </script>
